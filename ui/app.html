<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Token 热力图与战绩墙</title>
  <style>
:root,
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0f17;
  --surface: #111722;
  --surface-sub: #171f2d;
  --surface-elevated: #0e1420;
  --fg: #f1f5f9;
  --fg-muted: #94a3b8;
  --border: #222c3c;
  --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif);
  /* Aurora Teal -> Jade -> Emerald -> Electric Volt-Lime ramp */
  --lv0: #161d29;
  --lv0-border: #232d3f;
  --lv1: #123e4d;
  --lv2: #0d7368;
  --lv3: #15a866;
  --lv4: #3de066;
  --lv5: #b6f23c;
  --accent: #3de066;
  --accent-bg: rgba(61, 224, 102, 0.14);
  --blue: #38bdf8;
  --blue-bg: rgba(56, 189, 248, 0.14);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-sub: #f1f5f9;
  --surface-elevated: #e2e8f0;
  --fg: #0f172a;
  --fg-muted: #475569;
  --border: #e2e8f0;
  --lv0: #eef2f6;
  --lv0-border: #dde4ed;
  --lv1: #cffafe;
  --lv2: #6ee7b7;
  --lv3: #10b981;
  --lv4: #15803d;
  --lv5: #022c22;
  --accent: #16a34a;
  --accent-bg: rgba(22, 163, 74, 0.12);
  --blue: #0284c7;
  --blue-bg: rgba(2, 132, 199, 0.12);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}

.shell {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 20px 24px 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  z-index: 1;
}
.shell::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 380px;
  pointer-events: none;
  z-index: -1;
  background:
    radial-gradient(55% 100% at 16% 0%, rgba(61, 224, 102, 0.085), transparent 72%),
    radial-gradient(48% 90% at 84% 0%, rgba(56, 189, 248, 0.075), transparent 72%);
}
:root[data-theme="light"] .shell::before {
  background:
    radial-gradient(55% 100% at 16% 0%, rgba(16, 185, 129, 0.07), transparent 72%),
    radial-gradient(48% 90% at 84% 0%, rgba(14, 165, 233, 0.06), transparent 72%);
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.brand-lockup { display: flex; align-items: center; gap: 12px; }
.app-brand-mark { display: block; flex-shrink: 0; }
.title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.header-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
.hdr-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  background: var(--surface);
  color: var(--fg-muted);
  border: 1px solid var(--border);
}
.streak-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  background: var(--accent-bg);
  color: var(--accent);
  border: 1px solid rgba(57, 211, 83, 0.35);
}
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ui-ico { display: inline-block; vertical-align: middle; flex-shrink: 0; }
.icon-btn, .icon-tab { display: inline-flex; align-items: center; gap: 5px; }
.sec-title-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.section-title { display: inline-flex; align-items: center; gap: 7px; }
.sec-badges { display: inline-flex; align-items: center; gap: 5px; }
.sec-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  background: var(--surface-sub);
  color: var(--fg-muted);
  border: 1px solid var(--border);
}
.sec-chip.accent {
  background: var(--accent-bg);
  color: var(--accent);
  border-color: rgba(61, 224, 102, 0.35);
}
.kpi-ico { display: inline-flex; align-items: center; margin-right: 5px; }
.kpi-label { display: inline-flex; align-items: center; }
.gran-ico { display: inline-flex; align-items: center; color: var(--fg-muted); }
.mini-jump { display: inline-flex; align-items: center; gap: 4px; }
.mini-jump.icon-only { padding: 3px 6px; }
.stat-pill { display: inline-flex; align-items: center; gap: 4px; }
.chrono-head-row { display: flex; align-items: center; gap: 10px; }
.chrono-emblem { display: block; flex-shrink: 0; }
.hf-left { display: inline-flex; align-items: center; gap: 6px; }
.period-chip { gap: 5px; }
.period-chip span { display: inline-flex; align-items: center; gap: 4px; margin-right: auto; }

/* Unified flat 4x2 executive KPI bar with hairline dividers & rotating equivalence ticker */
.kpi-bar {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
@media (max-width: 1020px) {
  .kpi-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 680px) {
  .shell { padding: 14px 12px 24px; gap: 12px; }
  .surface { padding: 14px 14px; border-radius: 12px; }
  .kpi-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-cell { padding: 11px 12px 10px; }
  .kpi-val { font-size: 19px; }
  .kpi-unit { font-size: 11.5px; }
  .kpi-ticker-line { font-size: 11px; }
  .medal-grid { grid-template-columns: repeat(auto-fill, minmax(154px, 1fr)); gap: 9px; }
}
.kpi-cell {
  background: var(--surface);
  padding: 14px 18px 13px;
  min-width: 0;
}
.kpi-head {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
}
.kpi-label { font-size: 12px; font-weight: 600; color: var(--fg-muted); }
.kpi-val {
  margin-top: 5px;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.kpi-val.accent { color: var(--accent); }
.kpi-unit { font-size: 13.5px; font-weight: 600; color: var(--fg-muted); }

/* Animated Equivalence Gradient Carousel */
.kpi-ticker-stage {
  position: relative;
  height: 22px;
  margin-top: 7px;
  overflow: hidden;
}
.kpi-ticker-line {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  line-height: 22px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  will-change: transform, opacity, filter;
  transition:
    transform 0.48s cubic-bezier(0.22, 1, 0.36, 1),
    opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1),
    filter 0.48s cubic-bezier(0.22, 1, 0.36, 1);
}
.kpi-ticker-line.is-enter {
  opacity: 0;
  transform: translateY(10px);
  filter: blur(2px);
}
.kpi-ticker-line.is-active {
  opacity: 1;
  transform: translateY(0);
  filter: blur(0);
}
.kpi-ticker-line.is-exit {
  opacity: 0;
  transform: translateY(-10px);
  filter: blur(2px);
}
.kpi-eq, .kpi-tail {
  color: var(--fg-muted);
  flex-shrink: 0;
}
.kpi-tail {
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex-shrink: 1;
}
.kpi-hl {
  font-weight: 700;
  background: linear-gradient(90deg, #4ade80 0%, #34d399 48%, #38bdf8 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  flex-shrink: 0;
}
:root[data-theme="light"] .kpi-hl {
  background: linear-gradient(90deg, #15803d 0%, #0d9488 50%, #0284c7 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
@media (prefers-reduced-motion: reduce) {
  .kpi-ticker-line {
    transition: opacity 0.05s linear;
    transform: none !important;
    filter: none !important;
  }
}

/* Clean layered surfaces (Specular rim + Linear/Stripe bento depth) */
.surface {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045), 0 4px 18px rgba(0, 0, 0, 0.16);
}
:root[data-theme="light"] .surface {
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05), 0 8px 22px rgba(15, 23, 42, 0.03);
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  flex-wrap: wrap;
}
.section-title { margin: 0; font-size: 15px; font-weight: 700; }
.section-sub { margin: 3px 0 0; font-size: 12px; color: var(--fg-muted); }
.head-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.range-switch {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 10px;
  background: var(--surface-sub);
  border: 1px solid var(--border);
}
.range-btn {
  border: none;
  background: transparent;
  color: var(--fg-muted);
  padding: 4px 10px;
  border-radius: 7px;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.14s ease;
}
.range-btn:hover { color: var(--fg); }
.range-btn.active {
  background: var(--surface);
  color: var(--fg);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
}

.heatmap-split {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.heatmap-split.is-compact {
  display: grid;
  grid-template-columns: auto minmax(300px, 1fr);
  gap: 24px;
  align-items: start;
}
.heatmap-left {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

/* Full-width / compact uniform square contribution matrix */
.matrix-shell {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 8px 6px;
}
.matrix-header {
  display: grid;
  gap: 5px;
  margin-bottom: 6px;
  min-width: 620px;
}
.matrix-header.is-compact {
  min-width: 0;
  gap: 6px;
}
.month-lbl {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-muted);
  white-space: nowrap;
  overflow: visible;
}
.matrix-body {
  display: grid;
  gap: 5px;
  align-items: stretch;
  min-width: 620px;
}
.matrix-body.is-compact {
  min-width: 0;
  gap: 6px;
}
.dow-col {
  display: grid;
  grid-template-rows: repeat(7, minmax(0, 1fr));
  gap: 5px;
  align-items: center;
  font-size: 11px;
  line-height: 1;
  color: var(--fg-muted);
  padding-right: 4px;
}
.week-col {
  display: grid;
  grid-template-rows: repeat(7, minmax(0, 1fr));
  gap: 5px;
  min-height: 0;
}
.matrix-body.is-compact .dow-col,
.matrix-body.is-compact .week-col {
  gap: 6px;
}
.sq {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 7px;
  border: 1px solid rgba(128, 128, 128, 0.14);
  background: var(--lv0);
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  position: relative;
}
.sq.dense { border-radius: 4px; }
.sq.future {
  background: transparent;
  border-color: transparent;
  cursor: default;
}
.sq-num {
  font-size: 10.5px;
  font-weight: 700;
  opacity: 0.92;
  pointer-events: none;
}

.lv0 { background: var(--lv0); border-color: var(--lv0-border); color: var(--fg-muted); }
.lv1 { background: var(--lv1); border-color: #1b5669; color: #bae6fd; }
.lv2 { background: var(--lv2); border-color: #149183; color: #ccfbf1; }
.lv3 { background: var(--lv3); border-color: #22c57e; color: #032414; }
.lv4 { background: var(--lv4); border-color: #5ee880; color: #042f1a; }
.lv5 { background: var(--lv5); border-color: #d9f99d; color: #132a03; box-shadow: 0 0 12px rgba(182, 242, 60, 0.34); }

:root[data-theme="light"] .lv1 { border-color: #a5f3fc; color: #155e75; }
:root[data-theme="light"] .lv2 { border-color: #34d399; color: #064e3b; }
:root[data-theme="light"] .lv3 { border-color: #059669; color: #ffffff; }
:root[data-theme="light"] .lv4 { border-color: #166534; color: #ffffff; }
:root[data-theme="light"] .lv5 { border-color: #22c55e; color: #bef264; box-shadow: inset 0 0 0 1px rgba(34, 197, 94, 0.55); }

.sq.active-sq {
  box-shadow: var(--sq-glow, none);
}
.sq:hover:not(.future) {
  transform: scale(1.06);
  box-shadow: 0 0 0 1.5px var(--fg);
  z-index: 2;
}
.sq.selected {
  box-shadow: 0 0 0 1.5px var(--surface), 0 0 0 3.5px var(--blue);
  z-index: 3;
}
.sq.selected:hover:not(.future) {
  transform: scale(1.06);
  box-shadow: 0 0 0 1.5px var(--fg), 0 0 0 3.5px var(--blue);
  z-index: 4;
}

/* Centered continuous spectrum legend & granularity slider */
.legend-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding-top: 6px;
}
.legend-scale-row {
  display: inline-flex;
  align-items: flex-start;
  justify-content: center;
  gap: 12px;
  max-width: 100%;
  padding: 8px 16px 6px;
  border-radius: 12px;
  background: var(--surface-sub);
  border: 1px solid var(--border);
}
.legend-zero {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding-top: 0;
}
.legend-box {
  width: 13px;
  height: 13px;
  border-radius: 4px;
  border: 1px solid rgba(128, 128, 128, 0.2);
  display: inline-block;
}
.legend-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-muted);
}
.legend-spectrum-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: min(320px, 56vw);
}
.legend-spectrum-bar {
  position: relative;
  width: 100%;
  height: 11px;
  border-radius: 999px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.spec-tick {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1.5px;
  background: rgba(11, 15, 23, 0.55);
  transform: translateX(-50%);
}
:root[data-theme="light"] .spec-tick {
  background: rgba(255, 255, 255, 0.72);
}
.legend-tick-labels {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 4px;
}
.legend-tick-lbl {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--fg-muted);
  white-space: nowrap;
}
.granularity-row {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--surface-sub);
  border: 1px solid var(--border);
}
.gran-lbl {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-muted);
}
.gran-end {
  font-size: 10.5px;
  color: var(--fg-muted);
  opacity: 0.82;
}
.gran-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 132px;
  height: 5px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(14, 143, 107, 0.45), rgba(61, 224, 102, 0.65), rgba(226, 249, 70, 0.75));
  outline: none;
  cursor: pointer;
}
.gran-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--fg);
  border: 2px solid var(--accent);
  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
  cursor: grab;
  transition: transform 0.12s ease;
}
.gran-slider::-webkit-slider-thumb:hover { transform: scale(1.14); }
.gran-slider:active::-webkit-slider-thumb { cursor: grabbing; transform: scale(1.18); }
.gran-badge {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--accent);
  min-width: 78px;
  text-align: center;
}

/* Integrated Day Strip (bottom in wide mode, side inspector in compact mode) */
.day-strip {
  border-top: 1px solid var(--border);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.day-strip.is-side {
  border-top: none;
  border-left: 1px solid var(--border);
  padding-top: 4px;
  padding-left: 24px;
}
@media (max-width: 920px) {
  .heatmap-split.is-compact {
    grid-template-columns: 1fr;
    gap: 14px;
  }
  .day-strip.is-side {
    border-left: none;
    border-top: 1px solid var(--border);
    padding-left: 0;
    padding-top: 14px;
  }
}
.day-strip-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.day-strip-date { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.day-strip-date strong { font-size: 15px; }
.muted { color: var(--fg-muted); font-size: 12px; }
.day-jump-btns { display: flex; gap: 6px; }
.mini-jump {
  border: 1px solid var(--border);
  background: var(--surface-sub);
  color: var(--fg-muted);
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}
.mini-jump:hover { color: var(--fg); border-color: var(--fg-muted); }
.day-strip-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.stat-pill {
  padding: 3px 9px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 600;
  background: var(--surface-sub);
  color: var(--fg-muted);
  border: 1px solid var(--border);
}
.stat-pill.accent {
  background: var(--accent-bg);
  color: var(--accent);
  border-color: rgba(61, 224, 102, 0.35);
}
.day-convs { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
.day-conv-item { display: flex; flex-direction: column; gap: 4px; }
.day-conv-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 12.5px;
}
.day-conv-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-conv-name .idx { color: var(--fg-muted); font-weight: 700; margin-right: 4px; }
.day-conv-val { color: var(--fg-muted); font-size: 12px; flex-shrink: 0; }
.day-conv-track {
  width: 100%;
  height: 4px;
  border-radius: 999px;
  background: var(--surface-sub);
  overflow: hidden;
}
.day-conv-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--lv2), var(--lv4));
}

/* Tiered Vector Medal Gallery (36 unique SVG medals) */
.medal-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.star-total-pill {
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  background: rgba(245, 158, 11, 0.14);
  color: #fbbf24;
  border: 1px solid rgba(245, 158, 11, 0.35);
}
:root[data-theme="light"] .star-total-pill {
  color: #b45309;
  border-color: rgba(217, 119, 6, 0.42);
}
.tier-summary {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}
.tier-pill {
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 700;
  border: 1px solid var(--border);
}
.tier-pill.lv-0 { background: rgba(100, 116, 139, 0.14); color: #94a3b8; border-color: rgba(100, 116, 139, 0.30); }
.tier-pill.lv-1 { background: rgba(100, 116, 139, 0.22); color: #cbd5e1; border-color: rgba(148, 163, 184, 0.38); }
.tier-pill.lv-2 { background: rgba(148, 163, 184, 0.20); color: #f1f5f9; border-color: rgba(203, 213, 225, 0.45); }

.medal-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.cat-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.cat-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border);
  background: var(--surface-sub);

.cat-tab-lbl { color: var(--fg); font-weight: 700; white-space: nowrap; }
.cat-tab-cnt {

}
.cat-tab:hover {

}

.medal-cat-pill {

.medal-grid {

.medal-card.lv-tier-6:hover { border-color: rgba(34, 211, 238, 0.58); }
.medal-card.lv-tier-7:hover { border-color: rgba(16, 185, 129, 0.62); }
.medal-card.lv-tier-8 { border-color: rgba(168, 85, 247, 0.34); }

.medal-card-top {

}
.medal-cat-tag { font-size: 10.5px; font-weight: 600; color: var(--fg-muted); }
.medal-emblem-wrap {

.medal-svg.lv-tier-9 { filter: drop-shadow(0 0 9px rgba(56, 189, 248, 0.34)); }

.medal-name {

.medal-foot { display: flex; flex-direction: column; gap: 4px; margin-top: auto; padding-top: 2px; }

}

.medal-bar-fill.lv-0 { background: #475569; }

.medal-ratio {

/* Badge Inspector Modal */
.badge-dialog { max-width: 780px; }
.badge-inspect-body {
  display: grid;
  grid-template-columns: 210px 1fr;
  gap: 18px;
  align-items: center;
}
.badge-hero {
  background: var(--surface-sub);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
}
.badge-cur-score { font-size: 12.5px; color: var(--fg-muted); }
.badge-cur-score strong { color: var(--fg); font-size: 14px; }
.badge-next-hint { font-size: 11px; color: var(--accent); line-height: 1.4; }
.tier-ladder {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
@media (max-width: 640px) {
  .badge-inspect-body { grid-template-columns: 1fr; }
  .tier-ladder { grid-template-columns: 1fr; }
}
.tier-rung {
  background: var(--surface-sub);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tier-rung.next { border-color: rgba(56, 189, 248, 0.45); }
.tier-rung-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tier-target { font-size: 11.5px; font-weight: 600; color: var(--fg-muted); }

.split-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr));
  gap: 16px;
}
.hourly-focus-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 8px;
  background: var(--surface-sub);
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--fg-muted);
  flex-wrap: wrap;
}
.hourly-focus-bar strong { color: var(--fg); }
.hourly-chart {
  display: grid;
  grid-template-columns: repeat(24, 1fr);
  gap: 4px;
  align-items: end;
  height: 120px;
  padding-top: 6px;
}
.hr-col {
  border: none;
  background: transparent;
  padding: 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  font-family: inherit;
}
.hr-bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; }
.hr-bar {
  width: 100%;
  border-radius: 3px 3px 0 0;
  min-height: 3px;
  transition: transform 0.12s ease, filter 0.12s ease;
}
.hr-col:hover .hr-bar,
.hr-col.active .hr-bar {
  filter: brightness(1.18);
  outline: 1px solid var(--fg);
}
.hr-lbl { font-size: 10px; color: var(--fg-muted); height: 14px; margin-top: 4px; }
.hr-col.active .hr-lbl { color: var(--accent); font-weight: 700; }
.period-chips {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(115px, 1fr));
  gap: 6px;
}
.period-chip {
  padding: 5px 8px;
  border-radius: 8px;
  background: var(--surface-sub);
  border: 1px solid var(--border);
  font-size: 11px;
  color: var(--fg-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.period-chip strong { color: var(--fg); font-weight: 700; }

.model-list { display: flex; flex-direction: column; gap: 11px; }
.model-row-inner { display: flex; align-items: center; gap: 10px; }
.model-logo { display: block; flex-shrink: 0; }
.model-row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.model-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; flex-wrap: wrap; align-items: center; }
.model-name { font-weight: 600; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.model-role-pill {
  padding: 0 6px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 700;
  background: var(--blue-bg);
  color: var(--blue);
}
.model-effort-pill {
  padding: 0 6px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 600;
  background: var(--surface-sub);
  color: var(--fg-muted);
  border: 1px solid var(--border);
}
.model-meta { font-size: 11.5px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.model-cache-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 0 6px;
  border-radius: 5px;
  font-size: 10.5px;
  font-weight: 600;
  background: var(--accent-bg);
  color: var(--accent);
}
.models-more { font-size: 11px; color: var(--fg-muted); text-align: right; padding-top: 2px; }
.medal-cat-ico { display: inline-flex; align-items: center; color: var(--fg-muted); opacity: 0.78; }
.modal-title { display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap; }

.bar-track {
  flex: 1;
  width: 100%;
  height: 6px;
  border-radius: 999px;
  background: var(--bg);
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--lv3);
}
.bar-fill.muted { background: #64748b; }

.btn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease-out;
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #052e16; font-weight: 700; }
.btn.subtle { background: var(--surface-sub); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(5, 8, 16, 0.78);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overscroll-behavior: contain;
}
.modal-dialog {
  width: 100%;
  max-width: 1040px;
  max-height: 92vh;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
}
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-sub { font-size: 12px; color: var(--fg-muted); margin-top: 2px; }
.poster-dialog { max-width: 980px; }
.poster-dim-pill {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-muted);
  background: var(--surface-sub);
  border: 1px solid var(--border);
  vertical-align: middle;
}
.poster-controls-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.poster-stage {
  background: radial-gradient(circle at 50% 35%, #101829 0%, #05080f 100%);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 320px;
}
.poster-stage.is-light {
  background: radial-gradient(circle at 50% 35%, #e5e1d6 0%, #cdc8ba 100%);
}
.poster-img {
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 66vh;
  object-fit: contain;
  border-radius: 10px;
  display: block;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.52);
}
.modal-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.modal-action-btns {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-left: auto;
}
.poster-kbd-hint {
  font-size: 11.5px;
  color: var(--fg-muted);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.poster-kbd-hint code {
  padding: 1px 6px;
  border-radius: 5px;
  background: var(--surface-sub);
  border: 1px solid var(--border);
  color: var(--fg);
  font-size: 11px;
  font-family: 'Cascadia Mono', Consolas, monospace;
}
.modal-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.notice-ok { padding: 8px 12px; border-radius: 8px; background: var(--accent-bg); color: var(--accent); border: 1px solid rgba(57, 211, 83, 0.38); font-size: 12.5px; }
.banner-err { padding: 8px 12px; border-radius: 8px; background: rgba(239, 68, 68, 0.14); color: #ef4444; font-size: 12.5px; }
.empty { padding: 48px; text-align: center; color: var(--fg-muted); }

/* ── Theme switcher pill ─────────────────────────────────────────────────── */
.theme-pill {
  display: inline-flex; align-items: center; gap: 2px;
  padding: 2px; border-radius: 8px;
  background: var(--surface-sub); border: 1px solid var(--border);
}
.theme-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  min-width: 28px; height: 26px; padding: 0 8px; border: 0; border-radius: 6px;
  background: transparent; color: var(--fg-muted); cursor: pointer;
  font: inherit; font-size: 11px; font-weight: 700; transition: all .15s;
}
.theme-btn:hover { color: var(--fg); }
.theme-btn.active {
  background: var(--surface); color: var(--accent);
  box-shadow: 0 1px 4px rgba(0, 0, 0, .28), inset 0 0 0 1px rgba(57, 211, 83, .28);
}

/* ── Today Tri-Rings + Leverage + Six-Axis Hex Radar ─────────────────────── */
.pulse-grid {
  display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px;
}
.eng-split {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
}
.tri-rings-row {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.tri-rings-svg { flex-shrink: 0; display: block; overflow: visible; }
.tri-legend {
  flex: 1 1 160px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
}
.tri-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 5px 8px; border-radius: 8px; background: var(--surface-sub);
  border: 1px solid var(--border);
}
.tri-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
.tri-lbl {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--fg-muted); font-weight: 600;
}
.tri-val { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--fg); }
.tri-pct { font-size: 10.5px; font-weight: 700; margin-left: 4px; opacity: .82; }

.lev-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px;
}
.lev-tile {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 10px;
  background: var(--surface-sub); border: 1px solid var(--border);
  min-width: 0;
}
.lev-vis {
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.lev-icon {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent-bg); color: var(--accent);
}
.lev-body { min-width: 0; flex: 1; }
.lev-val { font-size: 14.5px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--fg); line-height: 1.15; }
.lev-sub {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10.5px; color: var(--fg-muted); margin-top: 2px; font-variant-numeric: tabular-nums;
}

.hex-radar-wrap {
  display: flex; align-items: center; justify-content: center; padding: 4px 0;
}
.hex-radar-svg { display: block; max-width: 100%; height: auto; overflow: visible; }

/* ── Visual-First Model Fleet Rows (Logo replaces text name + mini rings) ── */
.visual-models { display: flex; flex-direction: column; gap: 8px; }
.model-row-vis {
  display: grid; grid-template-columns: 36px minmax(64px, 1fr) 44px auto;
  align-items: center; gap: 10px;

/* ── Kinetic Iconography & Living Micro-Animations ───────────────────────── */
.kpi-medallion {
  width: 26px; height: 26px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--kpi-c, var(--accent));
  background: color-mix(in srgb, var(--kpi-c, var(--accent)) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--kpi-c, var(--accent)) 30%, transparent);
  flex-shrink: 0;
}
.kpi-wave-svg { display: block; flex-shrink: 0; opacity: .82; }
.gran-badge {
  display: inline-flex; align-items: center; gap: 5px;
  min-width: 66px; justify-content: center;
}
.gamma-curve-svg { display: block; flex-shrink: 0; }
.lang-badge-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--fg-muted); font-weight: 700;
}
.lang-badge-svg, .tier-gem-svg { display: block; flex-shrink: 0; }
.tier-pill { display: inline-flex; align-items: center; gap: 3px; }
.day-conv-val { display: inline-flex; align-items: center; gap: 8px; }
.story-stat-card span { display: inline-flex; align-items: center; justify-content: center; margin-bottom: 3px; color: var(--accent); }

.ag-cell { animation: agCellBreathe 3.6s ease-in-out infinite; }
.ag-cell.c2 { animation-delay: .9s; }
.ag-cell.c3 { animation-delay: 1.8s; }
.ag-cell.c4 { animation-delay: 2.7s; }

.kin-fire { transform-origin: 12px 18px; animation: kinFlame 2.2s ease-in-out infinite; }
.kin-bolt { transform-origin: 12px 12px; animation: kinBolt 2.8s ease-in-out infinite; }
.kin-float { animation: kinFloat 3.2s ease-in-out infinite; }
.kin-pulse { transform-origin: center; animation: kinPulse 2.8s ease-in-out infinite; }
.kin-cursor { animation: kinBlink 1.1s steps(1, end) infinite; }
.kin-spin { transform-origin: 12px 12px; animation: kinSpin 12s linear infinite; }
.kin-spin-slow { transform-origin: center; animation: kinSpin 18s linear infinite; }
.kin-twinkle { transform-origin: center; animation: kinTwinkle 2.6s ease-in-out infinite; }
.kin-rock { transform-origin: 16px 16px; animation: kinRock 4.2s ease-in-out infinite; }
.kin-sonar { transform-origin: center; transform-box: fill-box; animation: kinSonar 2.4s ease-out infinite; }
.kin-radar-sweep { animation: kinSpin 6.5s linear infinite; }
.kin-beam { transform-origin: left center; animation: kinBeam 3.4s ease-in-out infinite; }
.kin-code-l { animation: kinCodeL 3s ease-in-out infinite; }
.kin-code-r { animation: kinCodeR 3s ease-in-out infinite; }

.kin-bar { transform-box: fill-box; transform-origin: bottom center; animation: kinBar 2.4s ease-in-out infinite; }
.kin-bar.b1 { animation-delay: .35s; }
.kin-bar.b2 { animation-delay: .7s; }
.kin-bar.b3 { animation-delay: 1.05s; }

.punch-hot { animation: kinPulse 3.2s ease-in-out infinite; }

.medal-emblem-wrap.is-epic { position: relative; overflow: hidden; border-radius: 50%; }
.medal-emblem-wrap.is-epic::after {
  content: ''; position: absolute; inset: -20%;
  background: linear-gradient(115deg, transparent 36%, rgba(255,255,255,.28) 50%, transparent 64%);
  transform: translateX(-120%);
  animation: kinSheen 4.8s ease-in-out infinite;
  pointer-events: none;
}

@keyframes agCellBreathe {
  0%, 100% { opacity: 1; }
  50% { opacity: .48; }
}
@keyframes kinFlame {
  0%, 100% { transform: scale(1) rotate(0deg); }
  35% { transform: scale(1.06, 1.1) rotate(-3deg); }
  70% { transform: scale(0.97, 1.04) rotate(2.5deg); }
}
@keyframes kinBolt {
  0%, 84%, 100% { opacity: 1; transform: scale(1); }
  90% { opacity: .55; transform: scale(1.08); }
}
@keyframes kinFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-1.2px); }
}
@keyframes kinPulse {
  0%, 100% { opacity: .95; }
  50% { opacity: .58; }
}
@keyframes kinBlink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: .12; }
}
@keyframes kinSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes kinTwinkle {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .45; transform: scale(.86); }
}
@keyframes kinRock {
  0%, 100% { transform: rotate(-3deg); }
  50% { transform: rotate(4deg); }
}
@keyframes kinSonar {
  0% { transform: scale(.75); opacity: .55; }
  100% { transform: scale(1.95); opacity: 0; }
}
@keyframes kinBeam {
  0%, 100% { opacity: .95; }
  50% { opacity: .68; }
}
@keyframes kinCodeL {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-0.9px); }
}
@keyframes kinCodeR {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(0.9px); }
}

/* ── Universal Glassmorphic Smart Floating Tooltip ───────────────────────── */
.ag-svg-tip-target { cursor: pointer; pointer-events: all; }

.ag-tip {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
  will-change: transform, opacity;
  transition: opacity 0.14s cubic-bezier(0.22, 1, 0.36, 1);
  --tip-accent: var(--accent);
}
.ag-tip.is-open { opacity: 1; }

.ag-tip-body {
  position: relative;
  max-width: min(310px, calc(100vw - 24px));
  border-radius: 12px;
  background: rgba(11, 16, 28, 0.96);
  backdrop-filter: blur(18px) saturate(170%);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
  border: 1px solid color-mix(in srgb, var(--tip-accent) 42%, rgba(148, 163, 184, 0.3));
  box-shadow:
    0 16px 40px rgba(0, 0, 0, 0.56),
    0 2px 10px rgba(0, 0, 0, 0.34),
    inset 0 1px 0 rgba(255, 255, 255, 0.09);
  color: #f1f5f9;
  font-family: inherit;
  transform: translateY(4px) scale(0.97);
  transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1);
}
.ag-tip[data-placement="bottom"] .ag-tip-body {
  transform: translateY(-4px) scale(0.97);
}
.ag-tip.is-open .ag-tip-body {
  transform: translateY(0) scale(1);
}

.ag-tip.is-pill .ag-tip-body {
  border-radius: 9px;
  padding: 6px 11px;
}
.ag-tip-pill-inner {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 700;
  line-height: 1.3;
  white-space: nowrap;
}

.ag-tip.is-card .ag-tip-body {
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 170px;
}

.ag-tip-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.ag-tip-title-wrap {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.ag-tip-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 8px color-mix(in srgb, var(--tip-accent) 75%, transparent);
}
.ag-tip-title {
  font-size: 12px;
  font-weight: 800;
  color: #f8fafc;
  letter-spacing: 0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ag-tip-badge {
  flex-shrink: 0;
  padding: 1.5px 7px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 800;
  color: var(--tip-accent);
  background: color-mix(in srgb, var(--tip-accent) 18%, transparent);
  border: 1px solid color-mix(in srgb, var(--tip-accent) 36%, transparent);
  font-variant-numeric: tabular-nums;
}

.ag-tip-metrics {
  display: grid;
  gap: 5px;
}
.ag-tip-metrics.cols-1 { grid-template-columns: 1fr; }
.ag-tip-metrics.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ag-tip-metrics.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.ag-tip-stat {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 5px 8px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid rgba(255, 255, 255, 0.07);
}

  font-size: 10px;
  font-weight: 600;
  color: #94a3b8;
  line-height: 1.2;
}

  font-size: 12px;
  font-weight: 800;
  color: #f8fafc;
  font-variant-numeric: tabular-nums;

  white-space: nowrap;
}

.ag-tip-desc {
  font-size: 11.5px;
  line-height: 1.48;
  color: #cbd5e1;
  word-break: break-word;
}
.ag-tip-num {
  color: var(--tip-accent);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.ag-tip-hint {
  padding-top: 5px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 10px;
  font-weight: 600;
  color: #64748b;

  align-items: center;
  gap: 4px;
}
.ag-tip-hint::before {
  content: '↵';

}

.ag-tip-arrow {
  position: absolute;
  left: var(--arrow-x, 50%);
  width: 9px;
  height: 9px;
  margin-left: -4.5px;
  transform: rotate(45deg);
  background: rgba(13, 19, 31, 0.94);
}
.ag-tip[data-placement="top"] .ag-tip-arrow {
  bottom: -4.5px;
  border-right: 1px solid color-mix(in srgb, var(--tip-accent) 36%, rgba(148, 163, 184, 0.28));
  border-bottom: 1px solid color-mix(in srgb, var(--tip-accent) 36%, rgba(148, 163, 184, 0.28));
}
.ag-tip[data-placement="bottom"] .ag-tip-arrow {
  top: -4.5px;
  border-left: 1px solid color-mix(in srgb, var(--tip-accent) 36%, rgba(148, 163, 184, 0.28));
  border-top: 1px solid color-mix(in srgb, var(--tip-accent) 36%, rgba(148, 163, 184, 0.28));
}

/* Light Mode Ceramic Frosted Glass Tooltip */
:root[data-theme="light"] .ag-tip-body {
  background: rgba(255, 255, 255, 0.97);

}

}
:root[data-theme="light"] .ag-tip-k { color: #64748b; }
:root[data-theme="light"] .ag-tip-v { color: #0f172a; }

  color: #64748b;
}
:root[data-theme="light"] .ag-tip-arrow {

:root[data-theme="light"] .ag-tip[data-placement="top"] .ag-tip-arrow {

}

@media (prefers-reduced-motion: reduce) {
  .ag-tip, .ag-tip-body { transition: none !important; }
  .ag-cell, .kin-fire, .kin-bolt, .kin-float, .kin-pulse, .kin-cursor,
  .kin-spin, .kin-spin-slow, .kin-twinkle, .kin-rock, .kin-sonar,
  .kin-radar-sweep, .kin-beam, .kin-code-l, .kin-code-r, .kin-bar,

.arch-row-top, .ars-top, .finops-row-top, .hf-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
}
.arch-name, .ars-name {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.arch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.arch-cnt {
  padding: 0 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  color: var(--fg-muted);
  background: var(--surface);
  border: 1px solid var(--border);
}
.arch-vals, .ars-vals, .finops-nums {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
  color: var(--fg-muted);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.arch-vals strong, .ars-vals b, .finops-nums strong { color: var(--fg); }
.arch-track, .ars-track, .rw-bar-track, .finops-bar-bg {
  height: 5px;
  border-radius: 999px;
  background: var(--surface-elevated);
  overflow: hidden;
  margin-top: 5px;
}
.arch-fill, .ars-fill { height: 100%; border-radius: 999px; }
.ars-fill.tool { background: linear-gradient(90deg, #10b981, #3de066); }
.ars-fill.mcp { background: linear-gradient(90deg, #8b5cf6, #ec4899); }
.ars-fill.shell { background: linear-gradient(90deg, #0284c7, #38bdf8); }
.ars-raw {
  padding: 0 5px;
  border-radius: 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 10px;
  color: var(--fg-muted);
  font-family: 'Cascadia Mono', Consolas, monospace;
}
.ars-cmd-pill {
  padding: 1px 7px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 11.5px;
  font-weight: 700;
  color: var(--fg);
  font-family: 'Cascadia Mono', Consolas, monospace;
}

.finops-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
@media (max-width: 560px) {
  .finops-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.finops-stat {
  padding: 8px 9px;
  border-radius: 10px;
  background: var(--surface-sub);
  border: 1px solid var(--border);
  text-align: center;
}
.finops-k { font-size: 10px; font-weight: 600; color: var(--fg-muted); }
.finops-v { font-size: 15px; font-weight: 900; color: var(--fg); margin-top: 2px; font-variant-numeric: tabular-nums; }
.finops-v.accent { color: var(--accent); }
.finops-v.sky { color: var(--blue); }
.finops-v.gold { color: #fbbf24; }
.finops-v small { font-size: 10.5px; font-weight: 700; opacity: 0.72; }
.finops-row {
  display: flex;
  align-items: center;
  gap: 9px;
}
.finops-main { flex: 1; min-width: 0; }
.finops-name { font-size: 12px; font-weight: 700; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.finops-save-tag {
  padding: 0 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  background: var(--accent-bg);
  color: var(--accent);
}
.finops-bar-wo {
  height: 100%;
  border-radius: 999px;
  background: rgba(61, 224, 102, 0.34);
  overflow: hidden;
}
.finops-bar-act {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #0ea5e9, #38bdf8);
}
.finops-note { font-size: 10.5px; color: var(--fg-muted); text-align: right; }

.rw-legend { display: inline-flex; align-items: center; gap: 10px; font-size: 11px; color: var(--fg-muted); font-weight: 700; }
.rw-dot { display: inline-flex; align-items: center; gap: 4px; }
.rw-dot::before { content: ''; width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.rw-dot.read::before { background: #38bdf8; }
.rw-dot.write::before { background: #3de066; }

.hotfile-row {
  display: flex;
  align-items: center;
  gap: 9px;
}
.hf-rank { width: 20px; font-size: 11px; font-weight: 800; color: var(--fg-muted); flex-shrink: 0; }
.hf-main { flex: 1; min-width: 0; }
.hf-fname {
  font-size: 12px;
  font-weight: 700;
  color: var(--fg);
  font-family: 'Cascadia Mono', Consolas, monospace;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hf-ops { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; color: var(--fg-muted); flex-shrink: 0; }
.hf-rw-tag { font-size: 10.5px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.hf-ops strong { color: var(--fg); font-variant-numeric: tabular-nums; }
.rw-bar-span { height: 100%; display: flex; border-radius: 999px; overflow: hidden; }
.rw-r { height: 100%; background: #38bdf8; }
.rw-w { height: 100%; background: #3de066; }

.epic-sort-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: -4px;
}
.epic-sort-lbl { font-size: 10.5px; font-weight: 600; color: var(--fg-muted); }
.epic-sort-pills { display: inline-flex; gap: 5px; }
.mini-jump.active {
  background: var(--accent-bg);
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 42%, transparent);
}
.is-clickable { cursor: pointer; }
.day-conv-item.is-clickable {
  padding: 5px 7px;
  margin: 0 -7px;
  border-radius: 8px;
  transition: background 0.14s ease;
}
.day-conv-item.is-clickable:hover { background: var(--surface-sub); }
.eng-row.is-clickable:hover { border-color: var(--accent); transform: translateY(-1px); }
.arch-inline-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}
.ic-num.sky { color: var(--blue); }
.empty-mini { padding: 28px 12px; text-align: center; color: var(--fg-muted); font-size: 12px; }

/* Session Inspector Modal */
.session-dialog { max-width: 720px; }
.session-head-info { min-width: 0; flex: 1; }
.session-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.arch-pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  color: var(--ac, var(--accent));
  background: color-mix(in srgb, var(--ac, var(--accent)) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--ac, var(--accent)) 36%, transparent);
}
.session-title { margin: 0; font-size: 16.5px; font-weight: 800; color: var(--fg); line-height: 1.35; }
.session-kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
@media (max-width: 620px) {
  .session-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.session-kpi {
  padding: 9px 11px;
  border-radius: 11px;
  background: var(--surface-sub);
  border: 1px solid var(--border);
}
.sk-k { font-size: 10.5px; font-weight: 600; color: var(--fg-muted); }
.sk-v { font-size: 16px; font-weight: 900; color: var(--fg); margin-top: 3px; font-variant-numeric: tabular-nums; }
.sk-v.accent { color: var(--accent); }
.sk-v.sky { color: var(--blue); }
.sk-v.gold { color: #fbbf24; }
.sk-v small { font-size: 10.5px; font-weight: 700; color: var(--fg-muted); }

.session-comp-box {
  padding: 11px 13px;
  border-radius: 12px;
  background: var(--surface-sub);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sc-title { font-size: 12px; font-weight: 800; color: var(--fg); }
.sc-bar {
  display: flex;
  height: 10px;
  border-radius: 999px;
  overflow: hidden;
  gap: 2px;
  background: var(--surface-elevated);
}
.sc-seg { height: 100%; border-radius: 999px; }
.sc-seg.in { background: #38bdf8; }
.sc-seg.cache { background: #a855f7; }
.sc-seg.out { background: #3de066; }
.sc-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  font-size: 11px;
  color: var(--fg-muted);
}
.sc-legend span { display: inline-flex; align-items: center; gap: 5px; }
.sc-legend .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.sc-legend .dot.in { background: #38bdf8; }
.sc-legend .dot.cache { background: #a855f7; }
.sc-legend .dot.out { background: #3de066; }

.session-split {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
@media (max-width: 620px) {
  .session-split { grid-template-columns: 1fr; }
}
.session-panel {
  padding: 11px 12px;
  border-radius: 12px;
  background: var(--surface-sub);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sp-title { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--fg); }
.sp-list { display: flex; flex-direction: column; gap: 6px; }
.sp-model-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
.sp-m-name { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-m-val { color: var(--fg-muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.sp-m-val b { color: var(--fg); margin-left: 4px; }
.sp-tool-row { display: grid; grid-template-columns: 68px 1fr auto; align-items: center; gap: 8px; font-size: 11.5px; }
.sp-t-lbl { color: var(--fg-muted); font-weight: 700; white-space: nowrap; }
.sp-t-track { height: 6px; border-radius: 999px; background: var(--surface-elevated); overflow: hidden; }
.sp-t-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #38bdf8, #3de066); }
.sp-t-cnt { font-weight: 800; color: var(--fg); font-variant-numeric: tabular-nums; }
.session-foot { display: flex; flex-wrap: wrap; gap: 6px; }

/* Command Palette Modal (Ctrl+K) */
.cmdk-backdrop { align-items: flex-start; padding-top: 9vh; }
.cmdk-dialog {
  max-width: 580px;
  padding: 12px 14px;
  gap: 10px;
}
.cmdk-search-bar {
  display: flex;
  align-items: center;
  gap: 9px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  color: var(--fg-muted);
}
.cmdk-input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--fg);
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
}
.cmdk-kbd {
  padding: 2px 6px;
  border-radius: 5px;
  background: var(--surface-sub);
  border: 1px solid var(--border);
  font-size: 10px;
  font-weight: 700;
  font-family: 'Cascadia Mono', Consolas, monospace;
}
.cmdk-jumps {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
}
.cmdk-jump-lbl { font-size: 10.5px; font-weight: 700; color: var(--fg-muted); margin-right: 4px; }
.cmdk-jump-pill {
  border: 1px solid var(--border);
  background: var(--surface-sub);
  color: var(--fg-muted);
  padding: 3px 8px;
  border-radius: 999px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.cmdk-jump-pill:hover { border-color: var(--accent); color: var(--accent); }
.cmdk-results {
  max-height: 46vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 5px;
  overscroll-behavior: contain;
}
.cmdk-item {
  width: 100%;
  text-align: left;
  font-family: inherit;
  color: inherit;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: var(--surface-sub);
  cursor: pointer;
  transition: all 0.12s ease;
}
.cmdk-item:hover, .cmdk-item.is-active {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, var(--surface-sub));
}
.cmdk-item-main { flex: 1; min-width: 0; }
.cmdk-item-title {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--fg);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cmdk-item-meta {
  display: flex;
  gap: 5px;
  font-size: 10.5px;
  color: var(--fg-muted);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.arch-mini { font-weight: 800; }
.cmdk-item-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  flex-shrink: 0;
  font-size: 10.5px;
  color: var(--fg-muted);
  font-variant-numeric: tabular-nums;
}
.cmdk-item-right strong { font-size: 12px; color: var(--accent); }
.cmdk-foot {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  font-size: 10.5px;
  color: var(--fg-muted);
}
.cmdk-foot kbd {
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--surface-sub);
  border: 1px solid var(--border);
  font-size: 10px;
}

.ag-toast {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translate(-50%, 16px);
  z-index: 9998;
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(11, 16, 28, 0.94);
  color: #f8fafc;
  border: 1px solid rgba(61, 224, 102, 0.45);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  font-size: 12px;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.ag-toast.is-open {
  opacity: 1;
  transform: translate(-50%, 0);
}
:root[data-theme="light"] .ag-toast {
  background: #ffffff;
  color: #0f172a;
  box-shadow: 0 10px 28px rgba(15, 23, 42, 0.16);
}
